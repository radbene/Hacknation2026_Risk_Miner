[project]
name = "riskminer"
version = "0.1.0"
description = "RISK MINER – inteligentna baza doświadczeń inwestycji publicznych (HackNation 2026, MFiPR)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "rapidfuzz>=3.9",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pdfplumber>=0.11",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  "typer>=0.12",
  "anthropic>=0.40",
  "openai>=1.50",
  "google-genai>=0.3",
  "fastembed>=0.9",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
litellm = ["litellm>=1.50"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
riskminer = "riskminer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riskminer"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP046", "UP047", "UP040", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs a running Postgres (DATABASE_URL)",
  "network: calls external services",
]
