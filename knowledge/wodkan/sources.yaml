rows:
- name: e-Zamówienia / BZP
  meaning: Platforma e-Zamówienia i BZP – Biuletyn Zamówień Publicznych. Źródło ogłoszeń, dokumentów postępowania, wyniku,
    zmian i wykonania umowy dla zamówień objętych publikacją krajową.
- name: Platforma zakupowa zamawiającego
  meaning: Miejsce prowadzenia konkretnego postępowania. Zwykle zawiera SWZ, załączniki techniczne, pytania i odpowiedzi,
    modyfikacje oraz informacje o ofertach i wyborze.
- name: BIP
  meaning: BIP – Biuletyn Informacji Publicznej. Może zawierać umowy, rejestry umów, uchwały budżetowe, WPF, zarządzenia,
    sprawozdania, komunikaty i dokumenty dotyczące inwestycji.
- name: TED
  meaning: TED – Tenders Electronic Daily, elektroniczny dodatek do Dziennika Urzędowego Unii Europejskiej. Źródło ogłoszeń
    dla postępowań publikowanych na poziomie unijnym.
- name: KIO
  meaning: KIO – Krajowa Izba Odwoławcza. Źródło orzeczeń dotyczących odwołań w postępowaniach o udzielenie zamówienia.
- name: NIK i inne organy kontroli
  meaning: NIK – Najwyższa Izba Kontroli. Informacje o wynikach kontroli mogą opisywać nieprawidłowości, skutki i zalecenia.
    Podobne materiały mogą publikować inne organy kontrolne.
