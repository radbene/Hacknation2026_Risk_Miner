sector: wodkan
name: texts
rows:
- id: box_1
  text: Nie wszystkie dokumenty powstają w każdym postępowaniu, nie wszystkie są publikowane, a część może być dostępna dopiero
    po wystąpieniu o informację publiczną. Składanie takich wniosków nie jest częścią wyzwania. Mechanizm ma rozpoznać brak
    w przekazanej paczce, wyjaśnić jego znaczenie i wskazać, jaki dokument lub zakres danych należy uzupełnić. Braku pliku
    nie wolno utożsamiać z nieistnieniem dokumentu w inwestycji.
- id: box_2
  text: Tutaj od razu musimy się przyznać, że posiadamy własne bazy (np. bazę CST2021 - wszystkich projektów finansowanych
    ze źródeł funduszy europejskich) i spore ilości dokumentów. Po rozwiązaniu kwestii własności, poufności czy anonimizacji,
    będziemy docelowo uzupełniać i wzbogacać Risk Minera o wszystkie brakujące elementy. Kto wie, może we współpracy właśnie
    z Wami?
- id: box_3
  text: 'PPU lub SWU jako warunkowy substytut podpisanej umowy: jeżeli nie można załączyć finalnej umowy z podpisami, PPU
    albo SWU może być użyte jako zastępcze źródło warunków kontraktowych, pod warunkiem że z innych dokumentów znane są co
    najmniej wykonawca, cena, termin i identyfikator postępowania oraz uwzględniono modyfikacje. Materiał należy oznaczyć:
    „warunki kontraktowe odtworzone; brak podpisanego egzemplarza umowy”.'
- id: box_4
  text: Ryzyko to zdarzenie lub warunek, które może wpłynąć na koszt, termin, zakres, jakość, odbiór albo eksploatację. Efekt
    który najczęściej widzimy po zakończeniu inwestycji, najczęściej ma źródło już na etapie planowania inwestycji – w SWZ,
    PFU, STWiORB i PPU.
- id: box_5
  text: Prototyp ma być zaawansowanym narzędziem do obsługi przez Ekspertów. To oni mają finalnie oceniać i zatwierdzać wnioski.
    Narzędzie ma wykorzystywać dostępne materiały, wskazywać podstawę każdego wniosku oraz w razie potrzeby jasno komunikować,
    których dokumentów lub danych brakuje do silniejszej oceny.
