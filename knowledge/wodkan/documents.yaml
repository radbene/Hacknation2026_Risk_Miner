sector: wodkan
name: documents
rows:
- name: Ogłoszenie o zamówieniu
  description: Publiczna informacja rozpoczynająca postępowanie. Zawiera zamawiającego, przedmiot, tryb, terminy, warunki
    udziału, kryteria oceny oraz kody CPV – Common Procurement Vocabulary, czyli Wspólnego Słownika Zamówień.
  group: postepowanie
- name: SWZ – Specyfikacja Warunków Zamówienia
  description: Podstawowy dokument określający zasady udziału w postępowaniu, wymagania wobec wykonawców, sposób przygotowania
    oferty, terminy, kryteria oraz listę załączników.
  group: postepowanie
- name: PFU – Program Funkcjonalno-Użytkowy
  description: Dokument typowy dla formuły „projektuj i buduj”. Określa funkcje, zakres, parametry, oczekiwany efekt i wymagania
    zamawiającego, pozostawiając wykonawcy zaprojektowanie rozwiązania.
  group: postepowanie
- name: OPZ – Opis Przedmiotu Zamówienia
  description: Opis robót, dostaw lub usług i wymagań zamawiającego. Może być samodzielnym dokumentem albo częścią SWZ.
  group: postepowanie
- name: Dokumentacja projektowa
  description: Projekty, rysunki, trasy, schematy, zestawienia, obliczenia i rozwiązania techniczne. Może występować w wielu
    plikach i wersjach.
  group: postepowanie
- name: STWiORB – Specyfikacje Techniczne Wykonania i Odbioru Robót Budowlanych
  description: Wymagania dotyczące materiałów, sposobu wykonania, badań, kontroli jakości oraz odbioru poszczególnych robót.
  group: postepowanie
- name: Przedmiar robót / kosztorys ofertowy
  description: Pozycje i ilości robót przyjęte do wyceny. Przy wynagrodzeniu ryczałtowym mogą mieć charakter pomocniczy, dlatego
    należy sprawdzać ich relację do OPZ, projektu i umowy.
  group: postepowanie
- name: Decyzje, pozwolenia, warunki i uzgodnienia
  description: Dokumenty określające możliwość i warunki realizacji, np. decyzja środowiskowa, pozwolenie na budowę, warunki
    techniczne, uzgodnienia z gestorami sieci lub właścicielami terenu. Nie zawsze są załączane do postępowania.
  group: postepowanie
- name: Pytania wykonawców i odpowiedzi zamawiającego
  description: Pokazują miejsca niejasne, sporne lub trudne do wyceny. Odpowiedzi mogą doprecyzować albo zmienić SWZ, PFU,
    OPZ, projekt, STWiORB lub PPU.
  group: postepowanie
- name: Modyfikacje SWZ i załączników
  description: Formalne zmiany wymagań, zakresu, terminów, kryteriów, dokumentacji technicznej lub warunków przyszłej umowy.
    Analiza musi uwzględniać wersję obowiązującą po zmianach.
  group: postepowanie
- name: Informacja o kwocie przeznaczonej na sfinansowanie zamówienia
  description: Kwota ujawniona przez zamawiającego przed otwarciem ofert. Pozwala porównać założony budżet z cenami ofert.
  group: postepowanie
- name: Informacja z otwarcia ofert
  description: Zestawienie wykonawców, cen ofert oraz – zależnie od postępowania – innych zadeklarowanych parametrów.
  group: postepowanie
- name: Informacja o wyborze najkorzystniejszej oferty
  description: Wskazuje wybranego wykonawcę, cenę, punktację oraz wynik oceny ofert.
  group: postepowanie
- name: Ogłoszenie o wyniku postępowania
  description: Potwierdza udzielenie zamówienia, wykonawcę, wartość i podstawowe dane kontraktu albo informuje o zakończeniu
    postępowania bez udzielenia zamówienia.
  group: postepowanie
- name: PPU – Projektowane Postanowienia Umowy
  description: Projekt treści przyszłej umowy. Zawiera obowiązki stron, terminy, wynagrodzenie, kary, zasady zmian, odbiorów,
    gwarancji i odpowiedzialności.
  group: umowa
- name: SWU – Szczególne Warunki Umowy
  description: Warunki kontraktowe uzupełniające ogólne warunki i dokumentację techniczną. Mogą określać hierarchię dokumentów,
    procedury zmian, sposób rozliczeń i podział odpowiedzialności.
  group: umowa
- name: Podpisana umowa
  description: Finalny kontrakt z oznaczeniem stron, ceną, terminem, załącznikami i podpisami. Jest podstawowym źródłem wiążących
    warunków realizacji, lecz nie zawsze znajduje się w publicznie dostępnej paczce.
  group: umowa
- name: Aneks do umowy
  description: Dokument zmieniający konkretne postanowienia umowy, np. termin, wartość, zakres lub zasady realizacji. Uzasadnienie
    faktyczne może być skrótowe albo znajdować się w innym dokumencie.
  group: umowa
- name: Ogłoszenie o zmianie umowy
  description: Publiczna informacja o zmianie zakresu, wartości, terminu lub innych warunków oraz o podstawie prawnej zmiany.
    Może potwierdzić zmianę, ale nie zawsze wyjaśnia jej pełną przyczynę.
  group: umowa
- name: Ogłoszenie o wykonaniu umowy
  description: Informacja o wykonaniu lub zakończeniu kontraktu, dacie, wartości końcowej i zmianach. Zakres informacji zależy
    od formularza i sposobu jego wypełnienia.
  group: umowa
- name: Dokumenty realizacyjne i odbiorowe
  description: M.in. harmonogramy, protokoły narad, protokoły konieczności, raporty nadzoru, protokoły prób i odbiorów, dokumentacja
    powykonawcza oraz rozliczenie końcowe. Są szczególnie wartościowe, ale rzadko występują w komplecie w publicznej dokumentacji.
  group: umowa
- name: Orzeczenie KIO – Krajowej Izby Odwoławczej
  description: Opis zarzutów dotyczących postępowania, stanowisk stron, ustaleń Izby i rozstrzygnięcia. Dotyczy przede wszystkim
    ryzyk powstałych przed zawarciem umowy.
  group: zewnetrzne
- name: Informacja o wynikach kontroli NIK – Najwyższej Izby Kontroli lub innego organu
  description: Ustalenia kontrolne, stwierdzone nieprawidłowości, ich skutki i zalecenia. Może dostarczyć wiedzy o realizacji,
    której nie ma w dokumentach postępowania.
  group: zewnetrzne
- name: Uchwały, WPF, rejestry umów, sprawozdania i komunikaty w BIP
  description: Materiały publikowane w Biuletynie Informacji Publicznej mogą potwierdzać finansowanie, wartość, zmianę terminu,
    zawarcie umowy, zwiększenie środków, zakończenie albo problemy realizacyjne.
  group: zewnetrzne
- name: Komunikaty inwestora, operatora lub instytucji finansującej
  description: Aktualności, raporty i listy projektów mogą potwierdzać etap realizacji, zakres, dofinansowanie i osiągnięcie
    efektu. Są źródłem pomocniczym i wymagają powiązania z dokumentami podstawowymi.
  group: zewnetrzne
