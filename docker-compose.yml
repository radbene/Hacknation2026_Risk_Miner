# RISK MINER – full stack: db, api, worker, web, caddy (auto-HTTPS).
#   local dev:  docker compose up -d db          (API/web run from the host, see Makefile)
#   server:     DOMAIN=1.2.3.4.sslip.io docker compose --profile prod up -d --build   (or: make deploy)
#   local prod test (does not touch the dev DB):
#     DOMAIN=:80 DB_PORT=55499 HTTP_PORT=8088 HTTPS_PORT=8443 docker compose -p rmtest --profile prod up -d --build
name: riskminer

x-backend: &backend
  build: { context: ., dockerfile: backend/Dockerfile }
  image: riskminer-backend:latest
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+psycopg://riskminer:${POSTGRES_PASSWORD:-riskminer}@db:5432/riskminer
    SETTINGS_FILE: /app/config/settings.yaml
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5180}
  volumes:
    - ./config:/app/config:ro
    - ./knowledge:/app/knowledge
    - ./data:/app/data          # raw store, uploads, BZP zip, LLM replay cache, golden snapshot
    - ./exports:/app/exports    # example export + generated reports
  depends_on:
    db: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: riskminer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskminer}
      POSTGRES_DB: riskminer
    ports: ["127.0.0.1:${DB_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskminer -d riskminer"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    profiles: [prod]
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn riskminer.api.main:app --host 0.0.0.0 --port 8040 --proxy-headers --forwarded-allow-ips='*' --workers ${API_WORKERS:-2}"]
    expose: ["8040"]

  worker:
    <<: *backend
    profiles: [prod]
    # job queue + APScheduler monitoring of watched procedures (riskminer.monitor)
    command: ["sh", "-c", "until alembic current 2>/dev/null | grep -q head; do sleep 2; done; exec riskminer monitor worker"]
    healthcheck: { disable: true }

  web:
    build: { context: frontend, dockerfile: Dockerfile }
    image: riskminer-web:latest
    profiles: [prod]
    expose: ["80"]
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: [prod]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
